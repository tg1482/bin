# ============================================================================
# Tmux Configuration
# ============================================================================

# Enable mouse support (scrolling, pane selection, resizing)
set -g mouse on

# Fix scrolling behavior
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -n WheelDownPane send-keys -M

# ============================================================================
# Pane Appearance
# ============================================================================

# Active pane border - bright green, bold
set -g pane-active-border-style fg=colour46,bold

# Inactive pane border - dark gray
set -g pane-border-style fg=colour240

# ============================================================================
# Copy Mode (Vi-style)
# ============================================================================

# Use vi-style navigation in copy mode
setw -g mode-keys vi

# Vi-style copy-paste keybindings
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle

# ============================================================================
# General Settings
# ============================================================================

# Increase scrollback buffer
set -g history-limit 10000

# Start window and pane numbering at 0 (default)
set -g base-index 0
setw -g pane-base-index 0

# Renumber windows when one is closed
set -g renumber-windows on

# Reduce escape time (better vim experience)
set -sg escape-time 0

# Enable focus events (useful for vim/neovim)
set -g focus-events on

# Enable true color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ============================================================================
# Status Bar
# ============================================================================

# Status bar styling
set -g status-style bg=colour235,fg=colour250
set -g status-left-length 40
set -g status-right-length 60

# Show session name on left
set -g status-left "#[fg=colour46,bold] #S #[default]"

# Show date/time on right
set -g status-right "#[fg=colour250] %Y-%m-%d #[fg=colour46,bold] %H:%M "

# Window status styling
setw -g window-status-current-style fg=colour46,bold
setw -g window-status-style fg=colour250

# ============================================================================
# Key Bindings
# ============================================================================

# Reload config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with prefix + arrow keys
bind Up select-pane -U
bind Down select-pane -D
bind Left select-pane -L
bind Right select-pane -R

# Resize panes with prefix + Ctrl + arrow keys
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5

# Quick kill shortcuts (with confirmation)
bind k confirm-before -p "Kill pane #P? (y/n)" kill-pane
bind K confirm-before -p "Kill window #W? (y/n)" kill-window
bind Q confirm-before -p "Kill session #S? (y/n)" kill-session

# Send selected text from nvim to Claude Code pane
bind l run-shell "~/dev/bin/tmux-send-to-claude"
